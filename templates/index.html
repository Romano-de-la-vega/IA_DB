<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant SQL</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" href="/static/icon.ico" type="image/x-icon" />
    <style>
      :root[data-theme="dark"] {
        --bg: #0f1115;
        --card: #151821;
        --text: #e6e7ee;
        --muted: #9aa0aa;
        --accent: #6ea8fe;
        --accent-2: #84e1bc;
        --border: #2a2f3a;
        --btn-fg: #0c0e13;
      }
      :root[data-theme="light"] {
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #151821;
        --muted: #5b6472;
        --accent: #2f6df6;
        --accent-2: #25b78b;
        --border: #e4e7ee;
        --btn-fg: #ffffff;
      }
      html, body { height: 100%; }
      [hidden] { display:none !important; }
      body {
        margin:0; background:var(--bg); color:var(--text);
        font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      }
      .container { width:100%; max-width:980px; margin:32px auto; padding:0 16px; }
      h1 { font-size:28px; margin:0 0 6px; letter-spacing:.2px; }
      .subtitle { color:var(--muted); margin:0; }
      .card { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.15); padding:20px; }
      .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
      .field { grid-column:span 6; display:flex; flex-direction:column; gap:6px; }
      .field.full { grid-column:1/-1; }
      label { color:var(--muted); font-size:14px; }
      input[type="text"], input[type="password"], input[type="number"] {
        padding:10px 12px; border-radius:10px; border:1px solid var(--border);
        background:transparent; color:var(--text);
      }
      .actions { grid-column:1/-1; display:flex; gap:10px; margin-top:8px; }
      button { display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; border-radius:10px; border:1px solid transparent; background:var(--accent); color:var(--btn-fg); font-weight:600; cursor:pointer; }
      button.ghost { background:transparent; border-color:var(--border); color:var(--text); }
      .logs { margin-top:16px; max-height:320px; overflow:auto; background:transparent; border:1px solid var(--border); border-radius:12px; padding:12px; white-space:pre-wrap; word-break:break-word; }
      .header-row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    </style>
  </head>
  <body>
    <header class="container">
      <div class="header-row">
        <div>
          <h1>Assistant SQL</h1>
          <p class="subtitle">Posez une question en langage naturel</p>
        </div>
        <div style="display:flex; gap:8px;">
          <button id="settings-btn" type="button">⚙️ Paramètres</button>
          <button id="toggle-theme" type="button">🌙 Mode sombre</button>
        </div>
      </div>
    </header>
    <main class="container card">
      <form id="query-form" class="grid">
        <div class="field full">
          <label for="question">Question</label>
          <input id="question" name="question" type="text" placeholder="Ex : nombre d'utilisateurs cette semaine" />
        </div>
        <div class="actions">
          <button id="ask" type="submit">Envoyer</button>
        </div>
      </form>
      <section id="answer" class="status" hidden>
        <div id="response" class="logs"></div>
      </section>
    </main>

    <div id="settings-modal" class="card" style="display:none; position:fixed; top:10%; right:10%; width:320px; z-index:10;">
      <form id="settings-form" class="grid">
        <div class="field full"><label for="driver">Driver</label><input id="driver" name="driver" type="text" placeholder="postgresql" /></div>
        <div class="field full"><label for="host">Host</label><input id="host" name="host" type="text" /></div>
        <div class="field full"><label for="port">Port</label><input id="port" name="port" type="number" /></div>
        <div class="field full"><label for="database">Base</label><input id="database" name="database" type="text" /></div>
        <div class="field full"><label for="username">Utilisateur</label><input id="username" name="username" type="text" /></div>
        <div class="field full"><label for="password">Mot de passe</label><input id="password" name="password" type="password" /></div>
        <div class="actions"><button id="save-settings" type="submit">Sauvegarder</button><button id="close-settings" type="button" class="ghost">Fermer</button></div>
        <div class="actions"><button id="test-conn" type="button" class="ghost">Tester connexion</button></div>
        <div id="test-result" class="subtitle"></div>
      </form>
    </div>

    <footer class="container muted">Assistant SQL • Interface inspirée du transcripteur</footer>

    <script src="/static/sql.js" defer></script>
  </body>
</html>
