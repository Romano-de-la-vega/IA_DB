<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant SQL</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" href="/static/icon.ico" type="image/x-icon">

    <style>
      :root[data-theme="dark"] {
        --bg: #0f1115;
        --card: #151821;
        --text: #e6e7ee;
        --muted: #9aa0aa;
        --accent: #6ea8fe;
        --accent-2: #84e1bc;
        --border: #2a2f3a;
        --btn-fg: #0c0e13;
      }
      :root[data-theme="light"] {
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #151821;
        --muted: #5b6472;
        --accent: #2f6df6;
        --accent-2: #25b78b;
        --border: #e4e7ee;
        --btn-fg: #ffffff;
      }

      html, body { height: 100%; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      }
      .container {
        width: 100%;
        max-width: 980px;
        margin: 32px auto;
        padding: 0 16px;
      }
      h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: .2px; }
      .subtitle { color: var(--muted); margin: 0; }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,.15);
        padding: 20px;
      }

      .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
      .field { grid-column: span 12; display: flex; flex-direction: column; gap: 6px; }
      .actions { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 8px; }
      label { color: var(--muted); font-size: 14px; }
      input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); }

      button, .button {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 10px 14px; border-radius: 10px; border: 1px solid transparent;
        background: var(--accent); color: var(--btn-fg); font-weight: 600; cursor: pointer; text-decoration: none;
      }
      button.ghost { background: transparent; border-color: var(--border); color: var(--text); }

      .status { margin-top: 18px; }
      .logs {
        margin-top: 16px; max-height: 320px; overflow: auto;
        background: transparent; border: 1px solid var(--border); border-radius: 12px; padding: 12px;
        white-space: pre-wrap; word-break: break-word;
      }

      .header-row { display:flex; justify-content: space-between; align-items:center; gap: 12px; }
      #toggle-theme { min-width: 160px; }
      #settings { position: fixed; top: 20px; right: 20px; width: 320px; z-index: 100; }
    </style>
  </head>
  <body>
    <header class="container">
      <div class="header-row">
        <div>
          <h1>Assistant SQL</h1>
          <p class="subtitle">Interrogation en langage naturel</p>
        </div>
        <div style="display:flex; gap:8px;">
          <button id="toggle-theme" type="button">🌙 Mode sombre</button>
          <button id="toggle-settings" type="button">⚙️ Paramètres</button>
        </div>
      </div>
    </header>

    <main class="container card">
      <form id="query-form" class="grid">
        <div class="field">
          <label for="question">Question</label>
          <input id="question" name="question" type="text" placeholder="Quelle est la vente totale ?" />
        </div>
        <div class="actions">
          <button id="ask" type="submit">Envoyer</button>
        </div>
      </form>

      <section id="answer" class="status" hidden>
        <pre id="result" class="logs"></pre>
      </section>
    </main>

    <div id="settings" class="card" style="display:none;">
      <form id="settings-form" class="grid">
        <div class="field">
          <label for="driver">Driver</label>
          <input id="driver" type="text" placeholder="postgresql" />
        </div>
        <div class="field">
          <label for="host">Hôte</label>
          <input id="host" type="text" placeholder="localhost" />
        </div>
        <div class="field">
          <label for="port">Port</label>
          <input id="port" type="number" placeholder="5432" />
        </div>
        <div class="field">
          <label for="database">Base</label>
          <input id="database" type="text" />
        </div>
        <div class="field">
          <label for="username">Utilisateur</label>
          <input id="username" type="text" />
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" type="password" />
        </div>
        <div class="field">
          <label for="options">Options</label>
          <input id="options" type="text" placeholder="sslmode=require" />
        </div>
        <div class="field">
          <label for="api_key">Clé API OpenAI</label>
          <input id="api_key" type="password" placeholder="sk-..." />
        </div>
        <div class="actions">
          <button id="test-conn" type="button" class="ghost">Tester la connexion</button>
        </div>
      </form>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
